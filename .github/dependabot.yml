version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check e typescript-eslint ainda não aceitam TypeScript ≥ 6.1 (deploy da Vercel
      # quebrou com o 7.0.2 — npm install recusa o peer). Rever quando as duas libs suportarem.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
