name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A Vercel instala com `npm install`, que recusa conflito de peer que o `npm ci` deixa passar
      # (ex.: TypeScript 7 x @astrojs/check). Mesma resolução aqui, para o PR falhar antes do deploy.
      # Em pasta limpa: com a node_modules já instalada o conflito não aparece.
      - name: Resolução de dependências igual à da Vercel
        run: |
          d=$(mktemp -d) && cp package.json package-lock.json "$d" && cd "$d"
          npm install --dry-run --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Banco: migrations + pgTAP (RLS, privilégios, regras) + concorrência real das vagas (ADR-003).
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npx supabase db lint --fail-on error
      - run: npm run test:db
      - run: npm run test:concorrencia
      # Edge Function de inscrição com as chaves de TESTE públicas da Cloudflare.
      - run: cp supabase/functions/.env.example supabase/functions/.env
      - run: npm run functions:serve > functions.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null -X OPTIONS http://127.0.0.1:54321/functions/v1/register && break
            sleep 2
          done
      - run: npm run test:integracao
      - name: Log das funções
        if: failure()
        run: cat functions.log
